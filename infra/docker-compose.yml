name: carpooling-utnay

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpooling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpooling}
      POSTGRES_DB: ${POSTGRES_DB:-carpooling}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carpooling} -d ${POSTGRES_DB:-carpooling}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valhalla:
    # Digesto fijo: versión 3.9.1-2085e78a5. Evita que un pull de :latest
    # cambie la imagen y dispare una reconstrucción de teselas de ~2 h 13 min.
    image: "ghcr.io/valhalla/valhalla-scripted@sha256:e2078b638205fba6ef246d8ae731d7f197b346a0ebc74fb5f41b01db50504c90"
    ports:
      - "8002:8002"
    volumes:
      - ./osm/valhalla:/custom_files
    environment:
      server_threads: ${VALHALLA_THREADS:-4}
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
    restart: unless-stopped

volumes:
  pgdata:
